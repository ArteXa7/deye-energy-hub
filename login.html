<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Авторизація — Deye Energy System</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .login-card {
      background: var(--bg-card, #1e293b);
      border: 1px solid var(--border-card, rgba(148, 163, 184, 0.14));
      border-radius: var(--radius-xl, 26px);
      padding: 40px 34px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg, 0 16px 36px rgba(0, 0, 0, 0.5));
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #10b981 0%, #38bdf8 50%, #0284c7 100%);
    }

    .login-logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px auto;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
    }

    .login-logo svg {
      width: 30px;
      height: 30px;
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted, #94a3b8);
      margin-top: 6px;
      margin-bottom: 26px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted, #94a3b8);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-card, rgba(148, 163, 184, 0.2));
      border-radius: var(--radius-md, 14px);
      padding: 12px 16px;
      color: var(--text-main, #f8fafc);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--color-cyan, #38bdf8);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px 20px;
      border-radius: var(--radius-md, 14px);
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
    }

    .login-error {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: var(--radius-sm, 8px);
      color: #fb7185;
      font-size: 0.84rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <h1 class="login-title">DEYE ENERGY</h1>
      <p class="login-subtitle">Вхід до домашньої системи моніторингу інвертора</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="usernameInput">Логін</label>
          <input type="text" id="usernameInput" class="form-input" placeholder="admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="passwordInput">Пароль</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Увійти в дашборд</button>
      </form>

      <div class="login-error" id="loginError"></div>
    </div>
  </main>

  <script>
    (function () {
      'use strict';
      const form = document.getElementById('loginForm');
      const userInp = document.getElementById('usernameInput');
      const passInp = document.getElementById('passwordInput');
      const btn = document.getElementById('loginBtn');
      const errBox = document.getElementById('loginError');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Авторизація...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: userInp.value.trim(),
              password: passInp.value.trim()
            })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            window.location.href = '/';
          } else {
            throw new Error(data.detail || 'Невірний логін або пароль');
          }
        } catch (err) {
          errBox.textContent = err.message;
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Увійти в дашборд';
        }
      });
    })();
  </script>
</body>
</html>
